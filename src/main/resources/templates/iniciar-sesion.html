<th:block th:replace="~{layout/base :: layout(~{::title},~{::main})}">

    <title>Iniciar sesión - GameVault</title>

    <main class="container">

        <div class="panel"
             style="max-width: 500px; margin: 40px auto;">

            <h1 class="text-gradient"
                style="text-align: center;">
                Iniciar sesión
            </h1>

            <p style="color: var(--text-muted);
                      text-align: center;
                      margin-bottom: 30px;">
                Ingresa tus credenciales para acceder a tu bóveda.
            </p>

            <!-- Registro exitoso -->
            <p th:if="${param.registroExitoso}"
               style="color: var(--success);
                      text-align: center;
                      margin-bottom: 20px;">
                Usuario registrado correctamente.
            </p>

            <!-- Sesión cerrada -->
            <p th:if="${param.logout}"
               style="color: var(--success);
                      text-align: center;
                      margin-bottom: 20px;">
                Sesión cerrada correctamente.
            </p>

            <!-- Error de autenticación -->
            <p th:if="${error}"
               th:text="${error}"
               role="alert"
               style="color: var(--danger);
                      text-align: center;
                      margin-bottom: 20px;">
            </p>

            <form th:action="@{/login}" method="post">

                <div class="form-group">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           name="correo"
                           class="form-control"
                           placeholder="correo@ejemplo.com"
                           autocomplete="username"
                           required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Ingresa tu contraseña"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary"
                        style="width: 100%;">
                    Iniciar sesión
                </button>

            </form>

            <p style="text-align: center;
                      color: var(--text-muted);
                      margin-top: 25px;">
                ¿No tienes cuenta?

                <a th:href="@{/registro}"
                   style="color: var(--primary);
                          font-weight: 600;">
                    Regístrate
                </a>
            </p>

        </div>

    </main>

</th:block>
