
<th:block th:replace="~{layout/base :: layout(~{::title},~{::main})}">

    <title>Registrar Usuario - GameVault</title>

    <main class="container">

        <div class="panel"
             style="max-width: 500px; margin: 40px auto;">

            <h1 class="text-gradient"
                style="text-align: center;">
                Crear cuenta
            </h1>

            <p style="color: var(--text-muted);
                      text-align: center;
                      margin-bottom: 30px;">
                Regístrate para comenzar a gestionar tu bóveda de videojuegos.
            </p>

            <p th:if="${error}"
               th:text="${error}"
               role="alert"
               style="color: var(--danger);
                      text-align: center;
                      margin-bottom: 20px;">
            </p>

            <form th:action="@{/registro}" method="post">

                <div class="form-group">
                    <label for="nombre" class="form-label">
                        Nombre de usuario
                    </label>

                    <input type="text"
                           id="nombre"
                           name="nombre"
                           class="form-control"
                           placeholder="Ingresa tu nombre"
                           autocomplete="name"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="correo"
                           name="correo"
                           class="form-control"
                           placeholder="correo@ejemplo.com"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Mínimo 8 caracteres"
                           autocomplete="new-password"
                           minlength="8"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-primary"
                        style="width: 100%;">
                    ¡Regístrate!
                </button>

            </form>

            <p style="text-align: center;
                      color: var(--text-muted);
                      margin-top: 25px;">
                ¿Ya tienes cuenta?

                <a th:href="@{/login}"
                   style="color: var(--primary);
                          font-weight: 600;">
                    Iniciar sesión
                </a>
            </p>

        </div>

    </main>

</th:block>
